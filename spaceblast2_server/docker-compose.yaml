services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: spaceblast2
      POSTGRES_PASSWORD: "9mN6_Di-4UM7kcn-3Ms1d-PCUiYH6H9R"
    volumes:
      - spaceblast2_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "kSc4ApgOnVR8hULxqy-flp2c3n6_tsC8"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: spaceblast2_test
      POSTGRES_PASSWORD: "e6NN3m9JkjTiyP_mnjDcc4_FIq-g3SJF"
    volumes:
      - spaceblast2_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "sUJohZBjvb5flFR-BSwLjxCgkurAr-g0"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  spaceblast2_data:
  spaceblast2_test_data:
